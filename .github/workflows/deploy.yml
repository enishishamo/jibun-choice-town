# Build the Vite app and publish it to GitHub Pages on every push to main.
# 2026-09-07 (factory-architecture-audit-2026-09-06.md §16#1/#6): this
# workflow used to run `npm run build` and deploy unconditionally — no
# lint, no release gate, no Product Identity / QA / independent-review
# check of any kind. `release-gate-check.mjs` now fails this job (so
# nothing deploys) if the push touches src/ or public/ without a task in
# factory/state/tasks.json recording a passing gate for that exact commit.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-gate-check.mjs diffs the push's prior sha
          # (github.event.before) against HEAD. fetch-depth:2 was tried
          # first and found NOT to be enough by this session's own first
          # real run of this workflow (run 34066700565): a single push
          # landing several commits at once (a normal git push, not a
          # rebase/squash) means `before` can be more than 1-2 commits
          # back, so it didn't resolve within a depth-2 shallow clone and
          # the script silently fell back to diffing only HEAD~1 --
          # correctly checking the last commit alone, but blind to
          # earlier commits' app changes in the SAME push. Full history
          # avoids this whole class of bug; this repo is small enough
          # that the extra checkout cost is negligible.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 2026-09-21 (R5b): Ver.1 is frozen at ver1-archive-2026-09-20
      # (docs/jibun-choice-v2/MIGRATION_PLAN.md). The guard existed but only
      # ever ran when a session remembered to run it — an unattended push
      # could publish a Ver.1 drift. fetch-depth:0 above means the tag is
      # present, so this can run here.
      - name: Ver.1 freeze guard
        run: npm run check:ver1-freeze
      - name: Release gate (Product Identity / QA / independent review)
        run: node factory/scripts/release-gate-check.mjs --base "${{ github.event.before }}" --head "${{ github.sha }}"
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
